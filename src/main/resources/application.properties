#---------------------------Spring-----------------------------------#
spring.application.name=Campus Connect - Message API
spring.security.user.name=ccmsg
spring.security.user.password=ccmsg
spring.jackson.default-property-inclusion=non_null
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true
#---------------------------JPA | Flyway-----------------------------------#
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-migration-naming=true
server.port=8081
#---------------------------Environment variables---------------------------#
jwt.auth.converter.resource-id=${JWT_ID: msg_oauth}
jwt.auth.converter.principle-atribute=${JWT_PREFER: preferred_username}
api.security.token.secret=${API_SECRET: bleach_}
api.security.issuer=${API_ISSUER: connect_msg_api}
api.url=${API_URL:http://localhost:8081}
logging.level.org.springframework=INFO
#logging.level.org.springframework.security=DEBUG
#---------------------------Swagger----------------------------------------#
springdoc.api-docs.path=/api-docs
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=swagger-ui.html
springdoc.swagger-ui.operationsSorter=Alpha
server.forward-headers-strategy=framework
#Files
image.maxWidth:${IMAGE-maxWidth:3840}
image.maxHeight:${IMAGE-maxHeight:2160}
server.storagePath:/opt/events-files

