spring.application.name=Campus Connect - Message API
spring.security.user.name=ccmsg
spring.security.user.password=ccmsg
server.port=8180

#---------------------------Database---------------------------------------#
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:8922/message_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:ccadmin}
spring.datasource.password=${POSTGRES_PASSWORD:message}
spring.datasource.hikari.schema=messages


#---------------------------JPA | Flyway-----------------------------------#
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


logging.level.org.springframework=info